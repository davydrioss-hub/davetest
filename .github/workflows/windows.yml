name: Test and build Windows prototype
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original score build dependencies
        run: |
          python -m pip install numpy==2.3.5
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg xvfb mesa-vulkan-drivers libvulkan1
      - name: Prepare pinned engine and material library
        run: python tools/build_windows.py --prepare-only
      - name: Import project
        run: .build-cache/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --editor --import --quit
      - name: Core rules
        run: .build-cache/Godot_v4.4.1-stable_linux.x86_64 --headless --path . res://tests/core_tests.tscn
      - name: Real eight-player networking
        run: python tests/network_tests.py .build-cache/Godot_v4.4.1-stable_linux.x86_64
      - name: Render first-person input and cab
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          AFTER_HOURS_PREVIEW_DIR: build/rendered
        run: xvfb-run -a python tests/render_test.py .build-cache/Godot_v4.4.1-stable_linux.x86_64 forward_plus
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AfterHours-Rendered
          path: build/rendered/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Export Windows
        run: python tools/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: AfterHours-Windows
          path: build/AfterHours/
          if-no-files-found: error
          retention-days: 14
  windows-runtime:
    needs: test-and-build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: AfterHours-Windows
          path: package
      - name: Run exported Windows EXE and verify host save
        run: python tests/windows_smoke.py package/AfterHours.exe
